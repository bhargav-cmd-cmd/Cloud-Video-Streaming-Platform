{% extends "base.html" %}

{% block title %}Login - VidiStream{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="glass-panel auth-card">
            <div class="text-center mb-4">
                <i class="fa-solid fa-play-circle gradient-text mb-3" style="font-size: 3rem;"></i>
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-secondary">Sign in to manage your videos.</p>
            </div>
            
            <form action="{{ url_for('auth.login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label form-label-custom">Username</label>
                    <input type="text" class="form-control form-control-custom" id="username" name="username" placeholder="Enter your username" required autofocus>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label form-label-custom">Password</label>
                    <input type="password" class="form-control form-control-custom" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-premium btn-lg">Sign In</button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-secondary mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-decoration-none gradient-text fw-bold">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
