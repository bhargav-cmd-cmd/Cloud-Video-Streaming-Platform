{% extends "base.html" %}

{% block title %}Sign Up - VidiStream{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="glass-panel auth-card">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus gradient-text mb-3" style="font-size: 3rem;"></i>
                <h2 class="fw-bold">Create Account</h2>
                <p class="text-secondary">Join our cloud-based video streaming platform</p>
            </div>
            
            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label form-label-custom">Username</label>
                    <input type="text" class="form-control form-control-custom" id="username" name="username" placeholder="Choose a username" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label form-label-custom">Email Address</label>
                    <input type="email" class="form-control form-control-custom" id="email" name="email" placeholder="name@example.com" required>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label form-label-custom">Password</label>
                    <input type="password" class="form-control form-control-custom" id="password" name="password" placeholder="Create a password" required>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-premium btn-lg">Register</button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-secondary mb-0">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-decoration-none gradient-text fw-bold">Sign In</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
